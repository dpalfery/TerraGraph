name: Feature request
description: Suggest a capability or an improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. The most useful framing is the question you wanted
        answered and what you had to do instead.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What were you trying to find out, and what did you have to do instead?
      placeholder: I wanted to know which stacks pin a module below version X, so I grepped every source and correlated the version lines by hand.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should TerraGraph do? A sample command and the output you would want is ideal.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part does this touch?
      options:
        - terra_explore / retrieval and ranking
        - terra_for_address / reverse lookup
        - terra_impact / blast radius
        - terra_modules / module inventory
        - terra_orphans / dead configuration
        - The plan/state overlay
        - Parsing and the graph model
        - CLI or MCP surface
        - Install and distribution
        - Something else
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Does `terraform`, `tflint`, or an existing TerraGraph tool nearly do this already?
    validations:
      required: false
