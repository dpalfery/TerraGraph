name: Documentation
description: Something in the docs is wrong, missing or misleading
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        `docs/` is a governed corpus — every document carries typed frontmatter, and
        `component` and `owner` come from the closed vocabulary in `docs/catalog.md`.
        See [CONTRIBUTING.md](https://github.com/dpalfery/TerraGraph/blob/main/CONTRIBUTING.md#documentation).
  - type: input
    id: where
    attributes:
      label: Which document?
      placeholder: docs/token-benchmark.md, README.md, or a tool's MCP description
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong?
      description: Quote the passage if you can.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
    validations:
      required: false
